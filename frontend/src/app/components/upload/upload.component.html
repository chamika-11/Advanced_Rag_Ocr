<!-- src/app/components/upload/upload.component.html -->
<div class="upload-container">
  <h2>Upload Documents</h2>
  
  <!-- File Upload Area -->
  <div class="upload-area" 
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)">
    <div class="upload-content">
      <i class="upload-icon">📁</i>
      <p>Drag and drop files here or click to select</p>
      <input type="file" 
             multiple 
             accept=".pdf,.jpg,.jpeg,.png"
             (change)="onFileSelect($event)"
             class="file-input">
    </div>
  </div>

  <!-- Document Type Selection -->
  <div class="document-type-section">
    <label for="documentType">Document Type:</label>
    <select id="documentType" 
            [(ngModel)]="documentType" 
            class="document-type-select">
      <option value="">Select document type</option>
      <option value="invoice">Invoice</option>
      <option value="receipt">Receipt</option>
      <option value="contract">Contract</option>
      <option value="id_card">ID Card</option>
      <option value="passport">Passport</option>
      <option value="other">Other</option>
    </select>
  </div>

  <!-- Selected Files Display -->
  <div class="selected-files" *ngIf="selectedFiles.length > 0">
    <h3>Selected Files:</h3>
    <div class="file-list">
      <div class="file-item" *ngFor="let file of selectedFiles; let i = index">
        <span class="file-name">{{ file.name }}</span>
        <span class="file-size">{{ getFileSize(file) }}</span>
        <button class="remove-btn" (click)="removeFile(i)">×</button>
      </div>
    </div>
  </div>

  <!-- Upload Button -->
  <button class="upload-btn" 
          [disabled]="isUploading || selectedFiles.length === 0 || !documentType"
          (click)="uploadDocuments()">
    <span *ngIf="!isUploading">Upload Documents</span>
    <span *ngIf="isUploading">Uploading...</span>
  </button>

  <!-- Loading Indicator -->
  <div class="loading" *ngIf="isUploading">
    <div class="spinner"></div>
    <p>Processing documents...</p>
  </div>

  <!-- Success/Error Message -->
  <div class="message" *ngIf="message">
    <p [class.success]="uploadResults.length > 0" [class.error]="uploadResults.length === 0">
      {{ message }}
    </p>
  </div>

  <!-- Upload Results -->
  <div class="upload-results" *ngIf="uploadResults.length > 0">
    <h3>Upload Results:</h3>
    <div class="result-list">
      <div class="result-item" *ngFor="let result of uploadResults">
        <h4>{{ result.file }}</h4>
        <p><strong>Type:</strong> {{ result.document_type }}</p>
        <div class="structured-data">
          <strong>Extracted Data:</strong>
          <pre>{{ result.structured_data | json }}</pre>
        </div>
      </div>
    </div>
  </div>
</div>
